<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Under Construction | Jayanth Sai Marine Services</title>

<style>
    :root {
        --green: #82c341;
        --deep:  #123f58;
        --text:  #557485;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5fbff;
    }

    .construction-page {
        min-height: 100vh;
        position: relative;
        overflow: hidden;

        display: flex;
        flex-direction: column;

        background:
            linear-gradient(
                to bottom,
                #f5fbff 0%,
                #e9f6fc 55%,
                #c7e9f7 100%
            );
    }

    /* =========================
       CLOUDS
       ========================= */

    .cloud {
        position: absolute;
        width: 130px;
        height: 42px;
        background: rgba(255,255,255,.85);
        border-radius: 50px;
        opacity: .8;
        animation: cloudMove 35s linear infinite;
    }

    .cloud::before,
    .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
    }

    .cloud::before {
        width: 55px;
        height: 55px;
        left: 20px;
        bottom: 10px;
    }

    .cloud::after {
        width: 70px;
        height: 70px;
        right: 18px;
        bottom: 5px;
    }

    .cloud-1 {
        top: 16%;
        left: -180px;
        animation-duration: 42s;
    }

    .cloud-2 {
        top: 34%;
        left: -250px;
        transform: scale(.7);
        animation-duration: 55s;
        animation-delay: -20s;
    }

    .cloud-3 {
        top: 10%;
        left: -300px;
        transform: scale(.5);
        animation-duration: 65s;
        animation-delay: -35s;
    }

    @keyframes cloudMove {
        from { transform: translateX(0); }
        to   { transform: translateX(calc(100vw + 500px)); }
    }

    /* =========================
       BRAND
       ========================= */

    .brand {
        position: relative;
        z-index: 10;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;

        padding: 28px 20px 0;
    }

    .logo {
        width: 118px;
        height: 94px;
        object-fit: contain;
    }

    .brand-name {
        color: var(--green);
        font-size: clamp(15px, 3.2vw, 23px);
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: .3px;
        white-space: nowrap;
    }

    /* =========================
       SKY / HEADLINE
       ========================= */

    .sky {
        position: relative;
        z-index: 10;

        flex: 1;

        display: flex;
        align-items: flex-end;
        justify-content: center;

        padding: 0 20px 168px;
        text-align: center;
    }

    h1 {
        color: var(--deep);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 6.2vw, 68px);
        line-height: .98;
        letter-spacing: -2.5px;
    }

    .highlight {
        color: var(--green);
    }

    /* =========================
       SEA
       ========================= */

    .sea {
        position: relative;

        flex: 0 0 auto;

        height: 300px;

        background:
            linear-gradient(
                to bottom,
                #62b9d5,
                #2589b0
            );
    }

    .wave {
        position: absolute;
        top: -25px;
        left: -5%;

        width: 110%;
        height: 55px;

        background: #62b9d5;

        border-radius: 50% 50% 0 0;

        animation: wave 5s ease-in-out infinite;
    }

    .wave-2 {
        top: -15px;
        opacity: .55;
        animation-duration: 7s;
        animation-delay: -2s;
    }

    .wave-3 {
        top: -5px;
        opacity: .35;
        animation-duration: 9s;
        animation-delay: -4s;
    }

    @keyframes wave {
        0%, 100% { transform: translateX(-2%) rotate(0deg); }
        50%      { transform: translateX(2%)  rotate(.5deg); }
    }

    /* =========================
       BELOW WATERLINE TEXT
       ========================= */

    .below {
        position: absolute;
        z-index: 20;

        left: 0;
        right: 0;
        bottom: 30px;

        padding: 0 20px;
        text-align: center;
    }

    .description {
        margin: 0 auto;
        max-width: 560px;

        color: rgba(255,255,255,.93);
        font-size: 16px;
        line-height: 1.7;
        text-shadow: 0 1px 3px rgba(0,0,0,.18);
    }

    .cta {
        margin-top: 18px;

        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
    }

    .btn {
        display: inline-block;
        padding: 11px 22px;
        border: 2px solid #fff;
        border-radius: 999px;

        background: transparent;
        color: #fff;

        font-size: 13px;
        font-weight: 700;
        text-decoration: none;

        transition: background .15s, color .15s;
    }

    .btn-primary {
        background: #fff;
        color: #16719d;
    }

    .btn:hover {
        background: #fff;
        color: #0d5a7e;
    }

    /* =========================
       SHIP
       ========================= */

    .ship-wrapper {
        position: absolute;

        left: 50%;
        top: -120px;

        width: 300px;
        height: 130px;

        transform: translateX(-50%);

        animation: shipFloat 4s ease-in-out infinite;
    }

    @keyframes shipFloat {
        0%, 100% {
            transform: translateX(-50%) translateY(0)   rotate(-1deg);
        }
        50% {
            transform: translateX(-50%) translateY(-8px) rotate(1deg);
        }
    }

    .ship {
        position: absolute;
        bottom: 15px;
        left: 20px;

        width: 260px;
        height: 55px;
    }

    .hull {
        position: absolute;
        bottom: 0;
        left: 0;

        width: 260px;
        height: 50px;

        background: #173e52;

        clip-path: polygon(
            0 0,
            100% 0,
            85% 75%,
            72% 100%,
            18% 100%,
            5% 70%
        );

        border-bottom: 6px solid #0f2e3e;
    }

    .hull-line {
        position: absolute;
        left: 25px;
        top: 17px;

        width: 205px;
        height: 4px;

        background: #62b9d5;
    }

    .deck {
        position: absolute;
        bottom: 47px;
        left: 72px;

        width: 115px;
        height: 35px;

        background: #fff;

        border: 3px solid #173e52;
        border-bottom: 0;
    }

    .deck::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 8px;

        width: 91px;
        height: 7px;

        background: #dceff6;
    }

    .bridge {
        position: absolute;
        bottom: 82px;
        left: 130px;

        width: 65px;
        height: 34px;

        background: #f5f5f0;

        border: 3px solid #173e52;
    }

    .bridge-window {
        position: absolute;
        left: 8px;
        top: 8px;

        width: 49px;
        height: 12px;

        background: #65b5d1;

        border: 2px solid #173e52;
    }

    .mast {
        position: absolute;
        bottom: 82px;
        left: 105px;

        width: 4px;
        height: 65px;

        background: #173e52;
    }

    .flag {
        position: absolute;
        top: 0;
        left: 4px;

        width: 32px;
        height: 19px;

        background: var(--green);

        clip-path: polygon(0 0, 100% 25%, 0 55%);

        animation: flagWave .8s ease-in-out infinite alternate;
    }

    @keyframes flagWave {
        from { transform: skewY(0deg); }
        to   { transform: skewY(-5deg); }
    }

    .smoke {
        position: absolute;
        left: 65px;
        bottom: 105px;

        width: 12px;
        height: 12px;

        background: rgba(255,255,255,.65);
        border-radius: 50%;

        animation: smoke 3s ease-out infinite;
    }

    .smoke:nth-child(2) { animation-delay: 1s; }
    .smoke:nth-child(3) { animation-delay: 2s; }

    @keyframes smoke {
        0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
        20%  { opacity: .8; }
        100% { transform: translate(-30px, -80px) scale(2); opacity: 0; }
    }

    .wake {
        position: absolute;
        left: -35px;
        bottom: 2px;

        width: 70px;
        height: 10px;

        border-top: 3px solid rgba(255,255,255,.75);
        border-radius: 50%;

        animation: wake 2s ease-in-out infinite;
    }

    @keyframes wake {
        0%, 100% { width: 65px;  opacity: .4; }
        50%      { width: 100px; opacity: .9; }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        .brand {
            padding: 20px 16px 0;
        }

        .logo {
            width: 92px;
            height: 74px;
        }

        .sky {
            padding-bottom: 150px;
        }

        h1 {
            letter-spacing: -1.6px;
        }

        .description {
            font-size: 14px;
        }

        .sea {
            height: 290px;
        }

        .below {
            bottom: 26px;
        }

        .ship-wrapper {
            transform: translateX(-50%) scale(.75);
        }

        @keyframes shipFloat {
            0%, 100% {
                transform: translateX(-50%) scale(.75) translateY(0)   rotate(-1deg);
            }
            50% {
                transform: translateX(-50%) scale(.75) translateY(-8px) rotate(1deg);
            }
        }
    }

    /* =========================
       REDUCED MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>

<body>

<section class="construction-page">

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- Logo + company name -->
    <header class="brand">
        <img class="logo" src="Jayanth-logo.png" alt="Jayanth Sai Marine Services Logo">
        <div class="brand-name">Jayanth Sai Marine Services</div>
    </header>

    <!-- Bold headline, above the ship -->
    <div class="sky">
        <h1>
            We're setting<br>
            <span class="highlight">sail soon.</span>
        </h1>
    </div>

    <div class="sea">

        <div class="wave"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>

        <div class="ship-wrapper">
            <div class="ship">

                <div class="smoke"></div>
                <div class="smoke"></div>
                <div class="smoke"></div>

                <div class="mast">
                    <div class="flag"></div>
                </div>

                <div class="deck"></div>

                <div class="bridge">
                    <div class="bridge-window"></div>
                </div>

                <div class="hull">
                    <div class="hull-line"></div>
                </div>

                <div class="wake"></div>

            </div>
        </div>

        <!-- Text below the waterline -->
        <div class="below">
            <p class="description">
                Our website is currently being prepared. We're working behind the scenes
                to bring Jayanth Sai Marine Services online.
            </p>

            <div class="cta">
                <a class="btn btn-primary" href="tel:+919573374799">Call +91 95733 74799</a>
                <a class="btn" href="mailto:dhana@jayanthsai.com">Email Us</a>
            </div>
        </div>

    </div>

</section>

</body>
</html>
